# Qwen3-Omni-MoE single-node Mooncake Transfer Engine deploy.
#
# Same packing as the SHM baseline: stage 0 on cuda:0, stages 1+2 on cuda:1.
# Uses the duplex can_put/can_get connector path (async_chunk: false).
# For cross-node, see qwen3_omni_moe_mooncake.yaml.
#
# Usage (one node, 2 GPUs):
#   vllm serve Qwen/Qwen3-Omni-30B-A3B-Instruct --omni --log-stats \
#     --deploy-config vllm_omni/deploy/qwen3_omni_moe_mooncake_singlenode.yaml
#
# Dependencies: mooncake-transfer-engine-cuda13, RDMA for protocol: rdma.

async_chunk: false

# zmq_port is a *base* port (listen = base+stage_id). sender_host: auto resolves
# to the local RDMA IP so full-payload get(metadata=None) can query the sender.
connectors:
  thinker2talker_mooncake:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      sender_host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: "mlx5_0"
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"

  talker2code2wav_mooncake:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      sender_host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: "mlx5_0"
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    output_connectors:
      to_stage_1: thinker2talker_mooncake
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: thinker2talker_mooncake
    output_connectors:
      to_stage_2: talker2code2wav_mooncake
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.1
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: talker2code2wav_mooncake
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1

platforms:
  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.6
        tensor_parallel_size: 2
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "0,1"
      - stage_id: 1
        gpu_memory_utilization: 0.6
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "2"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "2"

  rocm:
    stages:
      - stage_id: 2
        enforce_eager: true

  xpu:
    stages:
      - stage_id: 0
        tensor_parallel_size: 4
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "0,1,2,3"
      - stage_id: 1
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "4"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        max_cudagraph_capture_size: 0
        devices: "4"
