# Qwen3-Omni-MoE deploy using Mooncake Transfer Engine for stage-to-stage
# streaming.  Topology, sampling params, GPU layout, and async_chunk gating
# match ``qwen3_omni_moe.yaml``; only the inter-stage connector is swapped
# from ``SharedMemoryConnector`` to ``MooncakeTransferEngineConnector``.
#
# Verified layout: 2x H100 (stage 0 on cuda:0, stages 1+2 on cuda:1), same as
# the SHM deploy.  Mooncake also supports cross-node stage placement when
# RDMA (or TCP fallback) is available between hosts.
#
# Usage:
#   vllm serve Qwen/Qwen3-Omni-30B-A3B-Instruct --omni --log-stats \
#     --deploy-config vllm_omni/deploy/qwen3_omni_moe_mooncake.yaml
#
# Dependencies: mooncake-transfer-engine-cuda13 for CUDA 13+ base images
# (``pip install mooncake-transfer-engine-cuda13``; do not use mooncake-transfer-engine),
# RDMA drivers for ``protocol: rdma`` (set ``protocol: tcp`` for bring-up without
# RDMA hardware).  Optional: ``RDMA_DEVICE_NAME`` env var to pin the NIC.
async_chunk: true

connectors:
  mooncake_connector:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: ""
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"
      # Chunk-transfer knobs consumed by talker2code2wav_async_chunk; kept
      # identical to the SHM deploy so accuracy stays comparable when swapping
      # backends.
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    output_connectors:
      to_stage_1: mooncake_connector
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: mooncake_connector
    output_connectors:
      to_stage_2: mooncake_connector
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.1
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: mooncake_connector
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1

platforms:
  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.6
        tensor_parallel_size: 2
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE   # Qwen3-Omni not FULL-cudagraph-safe on NPU
        devices: "0,1"
      - stage_id: 1
        gpu_memory_utilization: 0.6
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE   # code_predictor MaskedSelect / inner NPU graph replay
        devices: "2"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "2"

  # Code2Wav decode uses UpSample1d, which calls F.conv_transpose1d.
  # On ROCm this routes through MIOpen and is not capture-safe during
  # vLLM's outer graph capture, so stage 2 runs eager to avoid MIOpen/HIP
  # graph-capture failures.
  rocm:
    stages:
      - stage_id: 2
        enforce_eager: true

  xpu:
    stages:
      - stage_id: 0
        tensor_parallel_size: 4
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "0,1,2,3"
      - stage_id: 1
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "4"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        max_cudagraph_capture_size: 0
        devices: "4"
